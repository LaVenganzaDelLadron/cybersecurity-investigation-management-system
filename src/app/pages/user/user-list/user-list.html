<section class="page-shell">
  <header class="page-header">
    <div>
      <span class="eyebrow">Administration</span>
      <h1>Users</h1>
    </div>
    <button class="primary-btn" *ngIf="canManage" (click)="create()">New user</button>
  </header>

  <p *ngIf="loading">Loading users...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <p class="error-box" *ngIf="actionError">{{ actionError }}</p>

  <div class="record-grid" *ngIf="!loading && users.length">
    <article class="record-card" *ngFor="let user of users">
      <span class="record-icon" aria-hidden="true">U</span>
      <h2>{{ user.firstname }} {{ user.lastname }}</h2>
      <span class="record-subtitle">{{ user.email }}</span>
      <div class="record-meta">
        <span>Role: {{ user.role }}</span>
        <span>Status: <span class="badge status-{{ user.status }}">{{ user.status }}</span></span>
      </div>
      <div class="record-actions" *ngIf="canManage">
        <button type="button" (click)="edit(user.id)">Edit</button>
        <button type="button" (click)="remove(user)">Delete</button>
      </div>
    </article>
  </div>
  <p *ngIf="!loading && !users.length">No users found.</p>
</section>
<div class="modal-backdrop" *ngIf="modalOpen" (click)="closeModal()"><section #userModal class="resource-modal" tabindex="-1" role="dialog" aria-modal="true" aria-label="User form" (click)="$event.stopPropagation()"><app-user-form [modal]="true" [userId]="editingId" (saved)="closeModal(); load()" (cancelled)="closeModal()"></app-user-form></section></div>
