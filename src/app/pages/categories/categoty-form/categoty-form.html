<section class="category-form">
  <header class="form-header">
    <div>
      <span class="eyebrow">Category management</span>
      <h2 id="category-dialog-title">{{ id === null ? 'New category' : 'Edit category' }}</h2>
    </div>
    <button *ngIf="modal" type="button" class="close-btn" aria-label="Close category dialog" (click)="cancel()">×</button>
  </header>
  <p *ngIf="loadingRecord">Loading category...</p>
  <form *ngIf="!loadingRecord" [formGroup]="form" (ngSubmit)="submit()">
    <label><span>Name</span><input formControlName="name" maxlength="100" /></label>
    <small *ngIf="form.controls.name.touched && form.controls.name.invalid">A name is required.</small>
    <label><span>Description</span><textarea formControlName="description" maxlength="500"></textarea></label>
    <p class="error-box" *ngIf="error">{{ error }}</p>
    <p class="success-box" *ngIf="success">{{ success }}</p>
    <button type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Save category' }}</button>
    <button type="button" (click)="cancel()" [disabled]="loading">Cancel</button>
  </form>
</section>
