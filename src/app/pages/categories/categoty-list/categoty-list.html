<section class="page-shell">
  <header class="page-header">
    <div>
      <span class="eyebrow">Reference</span>
      <h1>Categories</h1>
    </div>
    <button class="primary-btn" *ngIf="canManage" (click)="create()">New category</button>
  </header>

  <p *ngIf="loading">Loading categories...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <p class="error-box" *ngIf="actionError">{{ actionError }}</p>

  <div class="record-grid" *ngIf="!loading && categories.length">
    <article class="record-card" *ngFor="let category of categories">
      <span class="record-icon" aria-hidden="true">C</span>
      <h2>{{ category.name }}</h2>
      <span class="record-subtitle">{{ category.description || 'Incident classification group' }}</span>
      <span class="record-meta">Category ID: #{{ category.id }}</span>
      <div class="record-actions" *ngIf="canManage">
        <button type="button" (click)="edit(category.id)">Edit</button>
        <button type="button" (click)="remove(category)">Delete</button>
      </div>
    </article>
  </div>
  <p *ngIf="!loading && !categories.length">No categories found.</p>
</section>

<div class="modal-backdrop" *ngIf="modalOpen" (click)="closeModal()">
  <section #categoryModal class="category-modal" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="category-dialog-title" (click)="$event.stopPropagation()">
    <app-categoty-form
      [categoryId]="editingId"
      [modal]="true"
      (saved)="refreshAfterSave()"
      (cancelled)="closeModal()"
    ></app-categoty-form>
  </section>
</div>
