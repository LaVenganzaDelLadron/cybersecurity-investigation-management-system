<section class="page-shell">
  <p *ngIf="loading">Loading incident...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <ng-container *ngIf="incident as currentIncident">
  <header class="page-header">
    <div>
      <span class="eyebrow">Incident</span>
      <h1>{{ currentIncident.title }}</h1>
    </div>
    <span class="badge severity-{{ currentIncident.severity }}">{{ currentIncident.severity }}</span>
  </header>
  <div class="toolbar">
    <button *ngIf="canEdit" type="button" (click)="openEdit()">Edit incident</button>
    <a *ngIf="canInvestigate" [routerLink]="['/notes']" [queryParams]="{ incident_id: currentIncident.id }">Investigation notes</a>
    <a [routerLink]="['/attachments']" [queryParams]="{ incident_id: currentIncident.id }">Attachments</a>
    <button *ngIf="isAdmin" type="button" (click)="deleteIncident()">Delete incident</button>
  </div>

  <div class="detail-grid">
    <article class="panel">
      <h2>Summary</h2>
      <p>{{ currentIncident.description }}</p>
      <ul>
        <li><strong>Status:</strong> <span class="badge status-{{ currentIncident.status }}">{{ currentIncident.status }}</span></li>
        <li><strong>Case ID:</strong> INC-{{ currentIncident.id }}</li>
        <li><strong>Owner:</strong> Security Operations</li>
      </ul>
    </article>
  </div>
  </ng-container>
</section>
<div class="modal-backdrop" *ngIf="editOpen" (click)="closeEdit()">
  <section #editModal class="resource-modal resource-modal--wide" tabindex="-1" role="dialog" aria-modal="true" aria-label="Edit incident" (click)="$event.stopPropagation()">
    <app-edit-incident
      [modal]="true"
      [incidentIdInput]="incident?.id ?? null"
      (saved)="closeEdit(); refreshIncident()"
      (cancelled)="closeEdit()"
    ></app-edit-incident>
  </section>
</div>
