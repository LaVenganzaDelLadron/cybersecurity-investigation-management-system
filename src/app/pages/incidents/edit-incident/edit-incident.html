<section class="form-shell">
  <header class="form-header"><div><span class="eyebrow">Incident management</span><h2>Edit incident</h2></div><button *ngIf="modal" type="button" class="close-btn" aria-label="Close" (click)="cancel()">×</button></header>
  <p *ngIf="loading">Loading incident...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()" class="incident-form" *ngIf="!loading">
    <label><span>Title</span><input formControlName="title" /></label>
    <label><span>Description</span><textarea formControlName="description"></textarea></label>
    <label><span>Category</span><select formControlName="category_id"><option [ngValue]="null">Select a category</option><option *ngFor="let category of categories" [ngValue]="category.id">{{ category.name }}</option></select></label>
    <div class="row">
      <label><span>Severity</span><select formControlName="severity"><option>low</option><option>medium</option><option>high</option><option>critical</option></select></label>
      <label><span>Status</span><select formControlName="status"><option value="new">New</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option><option *ngIf="isAdmin" value="closed">Closed</option></select></label>
    </div>
    <label *ngIf="isAdmin"><span>Assigned analyst</span><select formControlName="assigned_to"><option [ngValue]="null">Unassigned</option><option *ngFor="let analyst of analysts" [ngValue]="analyst.id">{{ analyst.full_name || analyst.firstname + ' ' + analyst.lastname || analyst.email }}</option></select></label>
    <label><span>Location</span><input formControlName="location" /></label>
    <label><span>Incident date</span><input formControlName="incident_date" type="datetime-local" /></label>
    <button type="submit" [disabled]="saving">{{ saving ? 'Updating...' : 'Update incident' }}</button>
    <button *ngIf="modal" type="button" class="secondary" (click)="cancel()" [disabled]="saving">Cancel</button>
  </form>
</section>
