<section class="page-shell">
  <header class="page-header">
    <div>
      <span class="eyebrow">Operations</span>
      <h1>Incidents</h1>
    </div>
    <button class="primary-btn" type="button" (click)="openCreate()">New incident</button>
  </header>

  <div class="toolbar">
    <button type="button" (click)="loadIncidents()">Refresh</button>
  </div>

  <p *ngIf="loading">Loading incidents...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <p *ngIf="!loading && !error && !incidents.length">No incidents found.</p>

  <table class="data-table" *ngIf="!loading && incidents.length">
    <thead>
      <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Severity</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let incident of incidents">
        <td>{{ incident.title }}</td>
        <td><span class="badge status-{{ incident.status }}">{{ incident.status }}</span></td>
        <td><span class="badge severity-{{ incident.severity }}">{{ incident.severity }}</span></td>
        <td>
          <a [routerLink]="['/incidents', incident.id]">View</a>
          <a *ngIf="canEdit" href="/incidents/{{ incident.id }}/edit" (click)="openEdit(incident.id, $event)">Edit</a>
          <button *ngIf="isAdmin" type="button" (click)="deleteIncident(incident)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>

<div class="modal-backdrop" *ngIf="modal" (click)="closeModal()">
  <section #incidentModal class="resource-modal" tabindex="-1" role="dialog" aria-modal="true" aria-label="Incident form" (click)="$event.stopPropagation()">
    <app-create-incident *ngIf="modal === 'create'" [modal]="true" (saved)="closeModal(); loadIncidents()" (cancelled)="closeModal()"></app-create-incident>
    <app-edit-incident *ngIf="modal === 'edit'" [modal]="true" [incidentIdInput]="editingId" (saved)="closeModal(); loadIncidents()" (cancelled)="closeModal()"></app-edit-incident>
  </section>
</div>
