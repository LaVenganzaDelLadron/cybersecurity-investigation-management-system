<section class="page-shell">
  <header class="page-header">
    <div>
      <span class="eyebrow">Case notes</span>
      <h1>Investigation notes</h1>
    </div>
    <button class="primary-btn" *ngIf="canManage" type="button" (click)="openModal(null)">Add note</button>
  </header>

  <p *ngIf="loading">Loading notes...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <p class="success-box" *ngIf="success">{{ success }}</p>
  <p *ngIf="!loading && !notes.length">No investigation notes found.</p>

  <div class="record-grid" *ngIf="!loading && notes.length">
    <article class="record-card" *ngFor="let note of notes">
      <span class="record-icon" aria-hidden="true">N</span>
      <h2>Investigation note #{{ note.id }}</h2>
      <span class="record-subtitle">{{ note.note }}</span>
      <div class="record-meta">
        <span>Incident #{{ note.incident_id }}</span>
        <span *ngIf="note.recommendation">Recommendation: {{ note.recommendation }}</span>
        <span *ngIf="note.created_at">{{ note.created_at | date:'medium' }}</span>
      </div>
      <div class="record-actions" *ngIf="canManage || canDelete">
        <a *ngIf="canManage" href="/notes/{{ note.id }}/edit" (click)="openModal(note.id); $event.preventDefault()">Edit</a>
        <button *ngIf="canDelete" type="button" (click)="deleteNote(note)">Delete</button>
      </div>
    </article>
  </div>
</section>
<div class="modal-backdrop" *ngIf="modalOpen" (click)="closeModal()"><section #noteModal class="resource-modal" tabindex="-1" role="dialog" aria-modal="true" aria-label="Investigation note form" (click)="$event.stopPropagation()"><app-notes-form [modal]="true" [noteIdInput]="editingId" (saved)="closeModal(); load()" (cancelled)="closeModal()"></app-notes-form></section></div>
