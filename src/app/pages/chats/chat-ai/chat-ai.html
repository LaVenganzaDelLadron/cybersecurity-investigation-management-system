<section class="page-shell">
  <header class="page-header">
    <div>
      <span class="eyebrow">AI assistant</span>
      <h1>Investigation copilot</h1>
    </div>
  </header>

  <p *ngIf="loading">Loading conversation...</p>
  <p class="error-box" *ngIf="error">{{ error }}</p>
  <div class="record-grid chat-window">
    <article class="record-card message" *ngFor="let message of messages">
      <span class="record-icon" aria-hidden="true">AI</span>
      <h2>Conversation #{{ message.id }}</h2>
      <div class="message-user">
        <span class="message-avatar" aria-hidden="true">Y</span>
        <strong>You</strong>
      </div>
      <p class="user-content">{{ message.userinput }}</p>
      <div class="message-assistant">
        <span class="message-avatar assistant-avatar" aria-hidden="true">AI</span>
        <strong>AI assistant</strong>
      </div>
      <div class="assistant-content" [innerHTML]="renderAssistantMessage(message.response)"></div>
      <div class="message-actions">
        <button type="button" (click)="edit(message)" *ngIf="editingId !== message.id">Edit</button>
        <button type="button" (click)="regenerate(message)" [disabled]="sending">Regenerate</button>
        <button type="button" (click)="delete(message)" *ngIf="isAdmin">Delete</button>
      </div>
      <form *ngIf="editingId === message.id" (ngSubmit)="saveEdit(message)" class="edit-form">
        <input [formControl]="form.controls.message" />
        <button type="submit" [disabled]="sending">Save</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
      </form>
    </article>
  </div>

  <form [formGroup]="form" (ngSubmit)="send()" class="chat-form">
    <input formControlName="message" placeholder="Ask the AI assistant..." />
    <button type="submit" [disabled]="sending">{{ sending ? 'Sending...' : 'Send' }}</button>
  </form>
</section>
